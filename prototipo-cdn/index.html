<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSMISS - Obra Social | Planes de salud</title>
  <meta name="description" content="OSMISS, obra social. Conocé nuestros planes OSMISS-100, 150, 200 y 500, la cartilla de prestadores, novedades y canales de contacto." />
  <!-- Open Graph (SEO técnico) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="OSMISS - Obra Social" />
  <meta property="og:description" content="Planes de salud, cartilla de prestadores y novedades de OSMISS." />
  <meta property="og:locale" content="es_AR" />
  <link rel="stylesheet" href="styles.css" />

  <!-- React y Babel desde CDN: no requiere instalar Node. Abrí este archivo directamente en el navegador. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    const DATA = window.SITE_DATA;
    const CFG = DATA.config;

    // ---------- Navegación por hash: #planes, #planes/osmiss-500, #novedades/<id> ----------
    function useRuta() {
      const leer = () => {
        const [pagina, detalle] = (window.location.hash.replace("#", "") || "home").split("/");
        return { pagina, detalle };
      };
      const [ruta, setRuta] = useState(leer);
      useEffect(() => {
        const alCambiar = () => { setRuta(leer()); window.scrollTo(0, 0); };
        window.addEventListener("hashchange", alCambiar);
        return () => window.removeEventListener("hashchange", alCambiar);
      }, []);
      return ruta;
    }

    // ---------- Envío de formularios (Zoho CRM vía API) ----------
    async function enviarFormulario(tipo, datos) {
      if (!CFG.formulariosApi) {
        console.info("[modo demo] Formulario", tipo, datos);
        return;
      }
      const res = await fetch(CFG.formulariosApi, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tipo, ...datos }),
      });
      if (!res.ok) throw new Error("Error " + res.status);
    }

    // Formulario genérico con confirmación de envío y protección antispam (campo trampa oculto).
    function Formulario({ tipo, children, textoBoton }) {
      const [estado, setEstado] = useState("inicial"); // inicial | enviando | ok | error
      const alEnviar = async (e) => {
        e.preventDefault();
        const datos = Object.fromEntries(new FormData(e.target));
        if (datos.website) return; // los bots completan el campo oculto
        delete datos.website;
        setEstado("enviando");
        try {
          await enviarFormulario(tipo, datos);
          setEstado("ok");
        } catch {
          setEstado("error");
        }
      };
      if (estado === "ok") {
        return <div className="aviso">¡Gracias! Recibimos tus datos y nos vamos a comunicar con vos a la brevedad.</div>;
      }
      return (
        <form className="form" onSubmit={alEnviar}>
          <input type="text" name="website" className="trampa" tabIndex="-1" autoComplete="off" aria-hidden="true" />
          {children}
          {estado === "error" && <div className="aviso error">No pudimos enviar el formulario. Intentá nuevamente.</div>}
          <button className="btn btn-primario" type="submit" disabled={estado === "enviando"}>
            {estado === "enviando" ? "Enviando..." : textoBoton}
          </button>
        </form>
      );
    }

    function Campo({ label, ...props }) {
      return (
        <label className="campo">
          <span>{label}{props.required && " *"}</span>
          {props.type === "textarea" ? <textarea {...props} /> : <input {...props} />}
        </label>
      );
    }

    // ---------- Menú horizontal superior ----------
    function Header({ pagina }) {
      const [abierto, setAbierto] = useState(false);
      return (
        <header className="header">
          <div className="contenedor">
            <a href="#home" className="logo">OSMISS<span>.</span></a>
            <button className="btn-menu" aria-label="Abrir menú" onClick={() => setAbierto(!abierto)}>☰</button>
            <nav className={"nav" + (abierto ? " abierto" : "")}>
              <ul>
                {DATA.menu.map((item) => (
                  <li key={item.id}>
                    <a href={"#" + item.id} className={pagina === item.id ? "activo" : ""} onClick={() => setAbierto(false)}>
                      {item.label}
                    </a>
                  </li>
                ))}
                <li className="nav-cta">
                  <a href="#afiliarme" className="btn btn-destacado" onClick={() => setAbierto(false)}>Quiero afiliarme</a>
                </li>
              </ul>
            </nav>
          </div>
        </header>
      );
    }

    // ---------- Carrusel principal (solo slides activos, por orden) ----------
    function Carrusel() {
      const slides = DATA.slides.filter((s) => s.activo).sort((a, b) => a.orden - b.orden);
      const [actual, setActual] = useState(0);
      const [pausado, setPausado] = useState(false);

      useEffect(() => {
        if (pausado || slides.length < 2) return;
        const id = setInterval(() => setActual((i) => (i + 1) % slides.length), 5000);
        return () => clearInterval(id);
      }, [pausado, slides.length]);

      if (slides.length === 0) return null;
      const ir = (i) => setActual((i + slides.length) % slides.length);

      return (
        <section className="carrusel" onMouseEnter={() => setPausado(true)} onMouseLeave={() => setPausado(false)}>
          {slides.map((s, i) => {
            const estilo = { background: s.fondo };
            if (s.imagen) estilo["--img-desktop"] = `url("${s.imagen}")`;
            if (s.imagenMobile || s.imagen) estilo["--img-mobile"] = `url("${s.imagenMobile || s.imagen}")`;
            return (
              <div key={i} className={"slide" + (i === actual ? " activo" : "") + (s.imagen ? " con-imagen" : "")} style={estilo}>
                <div className="contenedor">
                  <div className="slide-contenido">
                    <span className="etiqueta">{s.tipo}</span>
                    <h1>{s.titulo}</h1>
                    <p>{s.bajada}</p>
                    <a className="btn" href={"#" + s.destino}>{s.cta}</a>
                  </div>
                </div>
              </div>
            );
          })}
          <button className="flecha izq" aria-label="Anterior" onClick={() => ir(actual - 1)}>‹</button>
          <button className="flecha der" aria-label="Siguiente" onClick={() => ir(actual + 1)}>›</button>
          <div className="puntos">
            {slides.map((_, i) => (
              <button key={i} aria-label={"Ir a slide " + (i + 1)} className={i === actual ? "activo" : ""} onClick={() => ir(i)} />
            ))}
          </div>
        </section>
      );
    }

    // ---------- Planes ----------
    function PlanCard({ plan }) {
      return (
        <article className={"plan" + (plan.destacado ? " destacado" : "")}>
          {plan.destacado && <span className="cinta">★ PLAN SUPERADOR</span>}
          <h3>{plan.nombre}</h3>
          <p className="bajada">{plan.bajada}</p>
          <ul>
            {plan.caracteristicas.map((p) => <li key={p}>{p}</li>)}
          </ul>
          <a href={"#planes/" + plan.id} className={"btn " + (plan.destacado ? "btn-destacado" : "btn-primario")}>
            Ver detalle
          </a>
          <a href={CFG.cartillaUrl} target="_blank" rel="noopener" className="link-cartilla">Ver cartilla →</a>
        </article>
      );
    }

    function GrillaPlanes() {
      return (
        <div className="planes">
          {DATA.planes.map((plan) => <PlanCard key={plan.id} plan={plan} />)}
        </div>
      );
    }

    function PlanDetalle({ id }) {
      const plan = DATA.planes.find((p) => p.id === id);
      if (!plan) return <NoEncontrado />;
      return (
        <section className="seccion">
          <div className="contenedor">
            <a href="#planes" className="volver">← Todos los planes</a>
            <div className={"plan-ficha" + (plan.destacado ? " destacado" : "")}>
              <div className="plan-ficha-imagen" style={plan.imagen ? { backgroundImage: `url("${plan.imagen}")` } : null}>
                {!plan.imagen && <span>{plan.nombre}</span>}
                {plan.destacado && <span className="cinta">★ PLAN SUPERADOR</span>}
              </div>
              <div className="plan-ficha-texto">
                <h1>{plan.nombre}</h1>
                <p className="bajada">{plan.bajada}</p>
                <p>{plan.descripcion}</p>
                <div className="acciones">
                  <a href={"#afiliarme/" + plan.id} className="btn btn-destacado">Quiero afiliarme</a>
                  <a href={CFG.cartillaUrl} target="_blank" rel="noopener" className="btn btn-secundario">Ver cartilla</a>
                </div>
              </div>
            </div>
            <div className="grilla" style={{ marginTop: 32 }}>
              <div className="tarjeta">
                <h3>Características</h3>
                <ul className="lista-check">{plan.caracteristicas.map((c) => <li key={c}>{c}</li>)}</ul>
              </div>
              <div className="tarjeta">
                <h3>Beneficios</h3>
                <ul className="lista-check">{plan.beneficios.map((b) => <li key={b}>{b}</li>)}</ul>
              </div>
              <div className="tarjeta">
                <h3>Información adicional</h3>
                <p>{plan.infoAdicional}</p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ---------- Bloques reutilizables ----------
    function Titulo({ titulo, bajada }) {
      return (
        <div className="seccion-titulo">
          <h2>{titulo}</h2>
          {bajada && <p>{bajada}</p>}
        </div>
      );
    }

    function Pagina({ titulo, bajada, children }) {
      return (
        <section className="seccion">
          <div className="contenedor">
            <Titulo titulo={titulo} bajada={bajada} />
            {children}
          </div>
        </section>
      );
    }

    function PorQueElegirnos() {
      return (
        <div className="grilla">
          {DATA.porQueElegirnos.map((m) => (
            <div className="tarjeta motivo" key={m.titulo}>
              <div className="icono">{m.icono}</div>
              <h3>{m.titulo}</h3>
              <p>{m.texto}</p>
            </div>
          ))}
        </div>
      );
    }

    // Carrusel horizontal continuo de logos de prestadores.
    function CarruselLogos() {
      const logos = [...DATA.logos, ...DATA.logos]; // duplicado para el loop infinito
      return (
        <div className="logos">
          <div className="logos-pista">
            {logos.map((l, i) => (
              <div className="logo-item" key={i} aria-hidden={i >= DATA.logos.length}>
                {l.logo ? <img src={l.logo} alt={l.nombre} loading="lazy" /> : <span>{l.nombre}</span>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CtaAfiliarme() {
      return (
        <section className="cta-banda">
          <div className="contenedor">
            <div>
              <h2>¿Querés ser parte de OSMISS?</h2>
              <p>Dejanos tus datos y un asesor te ayuda a elegir el plan ideal.</p>
            </div>
            <a href="#afiliarme" className="btn btn-destacado">Quiero afiliarme</a>
          </div>
        </section>
      );
    }

    function ListaNoticias({ cantidad }) {
      const noticias = cantidad ? DATA.noticias.slice(0, cantidad) : DATA.noticias;
      return (
        <div className="grilla">
          {noticias.map((n) => (
            <article className="tarjeta noticia" key={n.id}>
              <small className="fecha">{n.fecha}</small>
              <h3>{n.titulo}</h3>
              <p>{n.resumen}</p>
              <a href={"#novedades/" + n.id} className="leer-mas">Leer más →</a>
            </article>
          ))}
        </div>
      );
    }

    function NoEncontrado() {
      return (
        <Pagina titulo="Página no encontrada" bajada="El contenido que buscás no existe o fue movido.">
          <p style={{ textAlign: "center" }}><a href="#home" className="btn btn-primario">Volver al inicio</a></p>
        </Pagina>
      );
    }

    // ---------- Páginas ----------
    function Home() {
      return (
        <>
          <Carrusel />
          <section className="seccion">
            <div className="contenedor">
              <Titulo titulo="Nuestros planes" bajada="Elegí la cobertura ideal para vos y tu familia" />
              <GrillaPlanes />
            </div>
          </section>
          <section className="seccion seccion-alterna">
            <div className="contenedor">
              <Titulo titulo="¿Por qué elegirnos?" />
              <PorQueElegirnos />
            </div>
          </section>
          <section className="seccion">
            <div className="contenedor">
              <Titulo titulo="Nuestros prestadores" bajada="Te atendés con los mejores profesionales" />
            </div>
            <CarruselLogos />
          </section>
          <section className="seccion" style={{ paddingTop: 0 }}>
            <div className="contenedor">
              <Titulo titulo="Últimas novedades" />
              <ListaNoticias cantidad={3} />
              <p style={{ textAlign: "center", marginTop: 28 }}>
                <a href="#novedades" className="btn btn-primario">Ver todas las novedades</a>
              </p>
            </div>
          </section>
          <CtaAfiliarme />
        </>
      );
    }

    function Planes({ detalle }) {
      if (detalle) return <PlanDetalle id={detalle} />;
      const filas = [
        ["Consultas médicas", "✔", "✔", "✔", "✔"],
        ["Especialistas sin derivación", "—", "✔", "✔", "✔"],
        ["Odontología", "—", "General", "General", "Completa + ortodoncia"],
        ["Internación", "—", "—", "Compartida", "Individual"],
        ["Medicamentos", "40%", "50%", "60%", "80%"],
        ["Cobertura nacional", "—", "—", "—", "✔"],
      ];
      return (
        <>
          <Pagina titulo="Nuestros planes" bajada="Elegí la cobertura ideal para vos y tu familia">
            <GrillaPlanes />
          </Pagina>
          <section className="seccion" style={{ paddingTop: 0 }}>
            <div className="contenedor">
              <Titulo titulo="Comparativa de planes" />
              <div className="tabla-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Prestación</th>
                      {DATA.planes.map((p) => (
                        <th key={p.id} className={p.destacado ? "col-destacada" : ""}>{p.nombre}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filas.map(([nombre, ...valores]) => (
                      <tr key={nombre}>
                        <td>{nombre}</td>
                        {valores.map((v, i) => (
                          <td key={i} className={DATA.planes[i].destacado ? "col-destacada" : ""}>{v}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </section>
          <CtaAfiliarme />
        </>
      );
    }

    function Cartilla() {
      const [texto, setTexto] = useState("");
      const [especialidad, setEspecialidad] = useState("");
      const especialidades = [...new Set(DATA.cartilla.map((c) => c.especialidad))];
      const resultados = DATA.cartilla.filter((c) =>
        (c.nombre + " " + c.localidad).toLowerCase().includes(texto.toLowerCase()) &&
        (!especialidad || c.especialidad === especialidad)
      );
      return (
        <Pagina titulo="Cartilla de prestadores" bajada="Buscá profesionales y centros de atención">
          <div className="aviso info">
            Consultá la cartilla completa y actualizada de OSMISS.{" "}
            <a href={CFG.cartillaUrl} target="_blank" rel="noopener"><strong>Abrir cartilla oficial →</strong></a>
          </div>
          <div className="buscador">
            <input placeholder="Nombre o localidad..." value={texto} onChange={(e) => setTexto(e.target.value)} />
            <select value={especialidad} onChange={(e) => setEspecialidad(e.target.value)}>
              <option value="">Todas las especialidades</option>
              {especialidades.map((e) => <option key={e}>{e}</option>)}
            </select>
          </div>
          <div className="grilla">
            {resultados.map((c) => (
              <div className="tarjeta" key={c.nombre}>
                <h3>{c.nombre}</h3>
                <p>{c.especialidad} · {c.localidad}</p>
              </div>
            ))}
          </div>
          {resultados.length === 0 && <p>No se encontraron prestadores.</p>}
        </Pagina>
      );
    }

    function Novedades({ detalle }) {
      if (detalle) {
        const n = DATA.noticias.find((x) => x.id === detalle);
        if (!n) return <NoEncontrado />;
        return (
          <section className="seccion">
            <div className="contenedor nota">
              <a href="#novedades" className="volver">← Todas las novedades</a>
              <small className="fecha">{n.fecha}</small>
              <h1>{n.titulo}</h1>
              <p className="nota-resumen">{n.resumen}</p>
              {n.cuerpo.map((parrafo, i) => <p key={i}>{parrafo}</p>)}
            </div>
          </section>
        );
      }
      return (
        <Pagina titulo="Novedades" bajada="Enterate de las últimas noticias de OSMISS">
          <ListaNoticias />
        </Pagina>
      );
    }

    function Prevencion() {
      return (
        <Pagina titulo="Prevención" bajada="Cuidarte hoy es vivir mejor mañana">
          <div className="grilla">
            {DATA.prevencion.map((p) => (
              <div className="tarjeta" key={p.titulo}><h3>{p.titulo}</h3><p>{p.texto}</p></div>
            ))}
          </div>
        </Pagina>
      );
    }

    function Institucional() {
      const inst = DATA.institucional;
      return (
        <>
          <Pagina titulo="Quiénes somos" bajada={inst.intro}>
            <div className="grilla">
              {inst.bloques.map((b) => (
                <div className="tarjeta" key={b.titulo}><h3>{b.titulo}</h3><p>{b.texto}</p></div>
              ))}
            </div>
          </Pagina>
          <section className="seccion seccion-alterna">
            <div className="contenedor">
              <Titulo titulo="¿Por qué elegirnos?" />
              <PorQueElegirnos />
            </div>
          </section>
        </>
      );
    }

    function FAQ() {
      const [categoria, setCategoria] = useState(DATA.faq[0].categoria);
      const [abierta, setAbierta] = useState(null);
      const grupo = DATA.faq.find((g) => g.categoria === categoria);
      return (
        <Pagina titulo="Preguntas frecuentes">
          <div className="faq">
            <div className="faq-tabs">
              {DATA.faq.map((g) => (
                <button
                  key={g.categoria}
                  className={g.categoria === categoria ? "activo" : ""}
                  onClick={() => { setCategoria(g.categoria); setAbierta(null); }}
                >
                  {g.categoria}
                </button>
              ))}
            </div>
            {grupo.preguntas.map((f, i) => (
              <div className="faq-item" key={f.p}>
                <button onClick={() => setAbierta(abierta === i ? null : i)} aria-expanded={abierta === i}>
                  {f.p} <span>{abierta === i ? "−" : "+"}</span>
                </button>
                {abierta === i && <div className="respuesta">{f.r}</div>}
              </div>
            ))}
          </div>
        </Pagina>
      );
    }

    function Tramites() {
      return (
        <Pagina titulo="Trámites" bajada="Gestioná tus trámites de forma rápida">
          <div className="grilla">
            {DATA.tramites.map((t) => (
              <div className="tarjeta" key={t.titulo}>
                <h3>{t.titulo}</h3>
                <p style={{ marginBottom: 16 }}>{t.texto}</p>
                <a href={"#" + t.destino} className="btn btn-primario">Iniciar</a>
              </div>
            ))}
          </div>
        </Pagina>
      );
    }

    // Formulario "Quiero afiliarme": nombre, apellido, DNI, teléfono, email, fecha de nacimiento, comentarios.
    function Afiliarme({ detalle }) {
      const plan = DATA.planes.find((p) => p.id === detalle);
      return (
        <Pagina titulo="Quiero afiliarme" bajada="Completá tus datos y un asesor se comunicará con vos">
          <div className="tarjeta form-tarjeta">
            <Formulario tipo="afiliacion" textoBoton="Enviar solicitud">
              <div className="fila">
                <Campo label="Nombre" name="nombre" required />
                <Campo label="Apellido" name="apellido" required />
              </div>
              <div className="fila">
                <Campo label="DNI" name="dni" inputMode="numeric" pattern="[0-9]{7,8}" title="7 u 8 números, sin puntos" required />
                <Campo label="Fecha de nacimiento" name="fechaNacimiento" type="date" required />
              </div>
              <div className="fila">
                <Campo label="Teléfono" name="telefono" type="tel" required />
                <Campo label="Email" name="email" type="email" required />
              </div>
              <label className="campo">
                <span>Plan de interés</span>
                <select name="plan" defaultValue={plan ? plan.nombre : ""}>
                  <option value="">Todavía no lo sé</option>
                  {DATA.planes.map((p) => <option key={p.id}>{p.nombre}</option>)}
                </select>
              </label>
              <Campo label="Comentarios" name="comentarios" type="textarea" />
            </Formulario>
          </div>
        </Pagina>
      );
    }

    // Formulario Contacto / Sugerencias / Reclamos: tipo, nombre, apellido, email, teléfono y mensaje.
    function Contactos() {
      return (
        <Pagina titulo="Contactos" bajada="Consultas, sugerencias y reclamos">
          <div className="grilla contacto">
            <div className="tarjeta">
              <h3>Canales de atención</h3>
              <p>📞 {CFG.telefono} ({CFG.horario})</p>
              <p>🚑 Guardia 24 hs: {CFG.guardia}</p>
              <p>✉️ {CFG.email}</p>
              <p>📍 {CFG.direccion}</p>
            </div>
            <div className="tarjeta">
              <Formulario tipo="contacto" textoBoton="Enviar">
                <label className="campo">
                  <span>Tipo *</span>
                  <select name="tipo" required defaultValue="">
                    <option value="" disabled>Seleccioná una opción</option>
                    <option>Consulta</option>
                    <option>Sugerencia</option>
                    <option>Reclamo</option>
                  </select>
                </label>
                <div className="fila">
                  <Campo label="Nombre" name="nombre" required />
                  <Campo label="Apellido" name="apellido" required />
                </div>
                <div className="fila">
                  <Campo label="Email" name="email" type="email" required />
                  <Campo label="Teléfono" name="telefono" type="tel" />
                </div>
                <Campo label="Mensaje" name="mensaje" type="textarea" required />
              </Formulario>
            </div>
          </div>
        </Pagina>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <div className="contenedor footer-grilla">
            <div>
              <a href="#home" className="logo logo-footer">OSMISS<span>.</span></a>
              <p>Obra social comprometida con tu salud y la de tu familia.</p>
            </div>
            <div>
              <strong>Navegación</strong>
              <ul>
                {DATA.menu.map((m) => <li key={m.id}><a href={"#" + m.id}>{m.label}</a></li>)}
              </ul>
            </div>
            <div>
              <strong>Planes</strong>
              <ul>
                {DATA.planes.map((p) => <li key={p.id}><a href={"#planes/" + p.id}>{p.nombre}</a></li>)}
              </ul>
            </div>
            <div>
              <strong>Contacto</strong>
              <p>📞 {CFG.telefono}<br />🚑 Guardia: {CFG.guardia}<br />✉️ {CFG.email}<br />📍 {CFG.direccion}</p>
              <a href="#afiliarme" className="btn btn-destacado">Quiero afiliarme</a>
            </div>
          </div>
          <div className="contenedor footer-legal">© {new Date().getFullYear()} OSMISS · Todos los derechos reservados</div>
        </footer>
      );
    }

    const PAGINAS = {
      home: Home, planes: Planes, cartilla: Cartilla, novedades: Novedades,
      prevencion: Prevencion, institucional: Institucional, faq: FAQ,
      tramites: Tramites, contactos: Contactos, afiliarme: Afiliarme,
    };

    function App() {
      const { pagina, detalle } = useRuta();
      const Componente = PAGINAS[pagina] || NoEncontrado;
      useEffect(() => {
        const item = DATA.menu.find((m) => m.id === pagina);
        document.title = (item && pagina !== "home" ? item.label + " | " : "") + "OSMISS - Obra Social";
      }, [pagina]);
      return (
        <>
          <Header pagina={pagina} />
          <main><Componente detalle={detalle} /></main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
